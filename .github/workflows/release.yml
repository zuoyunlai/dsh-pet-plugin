name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # index.js 有 peerDependency @deepseek-ai/schemastery，host 测试会 import 它；
      # test.yml 里装了，release.yml 之前漏了 —— v1.19.3 的 tag 跑就红在 Checks。
      - name: Install peer dependency (schemastery)
        run: npm install --no-save @deepseek-ai/schemastery

      # 组件级测试的依赖（devDependencies 里的 jsdom/react/react-dom）。
      # 发布前必须跑，否则 R-08 的键盘可达性与视频回退回归在发版链上无保护。
      - name: Install dev dependencies (jsdom for component tests)
        run: npm install --no-save jsdom react react-dom

      # The bundle is plain ES modules and the smoke test stubs React itself.
      # 这份清单必须与 test.yml 保持一致——曾经漏掉 overlay.dom 与后面的新用例。
      # ffmpeg：assets 测试的 manifest 要读 WebM 元数据；readme 口径测试要读 manifest。
      - name: Install ffmpeg (asset manifest metadata)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Checks
        run: |
          node --check client.js
          node --check index.js
          node tests/smoke.mjs
          node --test tests/host.test.mjs tests/assets.test.mjs tests/runtime.test.mjs tests/push-api.test.mjs tests/voice.test.mjs tests/overlay.dom.test.mjs tests/readme.test.mjs tests/focus.test.mjs tests/notify.test.mjs tests/state.test.mjs

      # Safe by default: skips when the token is missing, skips when the version is already
      # on npm (so a manual `node tools/release.cjs` run is never fought over).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set — skipping npm publish"
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm — skipping"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pack
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
