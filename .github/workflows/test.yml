name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install peer dependency (schemastery)
        run: npm install --no-save @deepseek-ai/schemastery

      - name: Build (must be byte-reproducible)
        run: |
          node build.mjs
          sha1=$(sha1sum client.js | cut -d' ' -f1)
          node build.mjs > /dev/null 2>&1
          sha2=$(sha1sum client.js | cut -d' ' -f1)
          if [ "$sha1" != "$sha2" ]; then
            echo "::error::build is not reproducible ($sha1 vs $sha2)"
            exit 1
          fi
          echo "reproducible: $sha1"

      - name: Persona generator in sync
        run: node tools/gen-personas.cjs --check

      - name: Install ffmpeg (asset manifest reads WebM codec/duration via ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Asset baseline (sha256 manifest)
        run: node tools/assets-manifest.cjs

      # PowerShell 5.1 把无 BOM 的 UTF-8 当 ANSI 解码，中文注释会让脚本直接解析失败
      - name: install.ps1 must be UTF-8 with BOM
        run: |
          head -c 3 install.ps1 | od -An -tx1 | grep -q "ef bb bf" || {
            echo "::error::install.ps1 lost its UTF-8 BOM (PowerShell 5.1 will misparse it)"; exit 1; }

      - name: Host tests
        run: node --test tests/host.test.mjs

      - name: Asset tests
        run: node --test tests/assets.test.mjs

      # 挂账③（2026-10-28 审计）：文档数字与代码单一源对表——240ms/2MB 这类漂移直接红
      - name: README facts (docs match code)
        run: node --test tests/readme.test.mjs

      - name: Smoke (renders personas/moods/panel, asserts video element + i18n)
        run: node tests/smoke.mjs

      # 1.19.3：可控定时器/虚拟时钟的台架。smoke 只能证明"能渲染"，
      # 动作链、失败回退、面板夹取、轮询超时这类行为要靠这一层。
      - name: Behavior regression (timers, clip fallback, layout, polling)
        run: node --test tests/runtime.test.mjs tests/push-api.test.mjs tests/voice.test.mjs

      # 1.21.0 R-08：组件级测试（真 DOM 跑 client.js）。devDeps 里的 jsdom/react/react-dom
      # 只装在 CI，不进包；缺了这一步，键盘可达性与视频回退就没有任何自动化保护。
      - name: 'Component tests (jsdom - menu keyboard, Escape, video fallback)'
        run: |
          npm install --no-save jsdom react react-dom
          node --test tests/overlay.dom.test.mjs

      - name: Syntax check index.js and lib
        run: node --check index.js && node --check lib/tts.js && node --check lib/prompt.js

      - name: npm pack dry run
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q "package size" || exit 1

  # 挂账②（2026-10-28 审计）：jsdom 证明不了的事——真 Chromium 里素材真的渲染、
  # VP9+alpha 片段真的能播（瘦身重编码后的最要紧回归）、prefers-reduced-motion 下
  # 宿主元素动画不被插件 CSS 关掉（R-03 泄漏的端到端回归）。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install playwright (library mode, no test runner)
        run: npm install --no-save playwright

      - name: Install chromium
        run: npx playwright install chromium --with-deps

      - name: Browser smoke (preview.html + clip decode + reduced-motion probe)
        run: node tests/browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: browser-preview
          path: tests/.browser-preview.png
          if-no-files-found: ignore

  # 本产品是 Windows 桌面优先（install.ps1 / SAPI 兜底），主平台从未进过 CI。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install peer + dev deps
        run: npm install --no-save @deepseek-ai/schemastery jsdom react react-dom

      - name: Full test suite on Windows
        run: npm test
