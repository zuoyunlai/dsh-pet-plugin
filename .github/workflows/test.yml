name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install peer dependency (schemastery)
        run: npm install --no-save @deepseek-ai/schemastery

      - name: Build (must be byte-reproducible)
        run: |
          node build.mjs
          sha1=$(sha1sum client.js | cut -d' ' -f1)
          node build.mjs > /dev/null 2>&1
          sha2=$(sha1sum client.js | cut -d' ' -f1)
          if [ "$sha1" != "$sha2" ]; then
            echo "::error::build is not reproducible ($sha1 vs $sha2)"
            exit 1
          fi
          echo "reproducible: $sha1"

      - name: Persona generator in sync
        run: node tools/gen-personas.cjs --check

      - name: Asset baseline (sha256 manifest)
        run: node tools/assets-manifest.cjs

      - name: Host tests
        run: node --test tests/host.test.mjs

      - name: Asset tests
        run: node --test tests/assets.test.mjs

      - name: Smoke (renders personas/moods/panel, asserts video element + i18n)
        run: node tests/smoke.mjs

      - name: Syntax check index.js and lib
        run: node --check index.js && node --check lib/tts.js && node --check lib/prompt.js

      - name: npm pack dry run
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q "package size" || exit 1
