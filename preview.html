<!doctype html><meta charset="utf-8"><title>dsh-pet preview</title>
<style>
body{margin:0;background:#14161b;color:#e9ecf1;font-family:system-ui,"Microsoft YaHei",sans-serif}
h1{font-size:15px;font-weight:600;padding:18px 22px 6px;margin:0}
p.sub{margin:0;padding:0 22px 10px;font-size:12px;opacity:.55}
.row{display:flex;align-items:center;gap:4px;padding:6px 18px}
.who{width:132px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.who span{opacity:.5;font-size:11px}
.cell{width:124px;display:flex;flex-direction:column;align-items:center}
.cell i{font-style:normal;font-size:10.5px;opacity:.45;margin-top:-6px}

.dsh-pet-root{position:fixed;right:28px;bottom:24px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  font-family:var(--dsw-alias-font-sans,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif);color:var(--dsw-alias-text-primary,#e9ecf1);
  pointer-events:none;user-select:none;-webkit-user-select:none}
.dsh-pet-root *{box-sizing:border-box}
.dsh-pet-bubble{pointer-events:auto;max-width:240px;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.5;
  background:var(--dsw-alias-bg-elevated,rgba(32,35,42,.96));border:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.12));
  box-shadow:0 6px 22px rgba(0,0,0,.28);position:relative;animation:dsh-pet-pop .18s ease-out}
.dsh-pet-bubble:after{content:"";position:absolute;right:22px;bottom:-5px;width:9px;height:9px;transform:rotate(45deg);
  background:var(--dsw-alias-bg-elevated,rgba(32,35,42,.96));border-right:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.12));
  border-bottom:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.12))}
.dsh-pet-row{display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.dsh-pet-input{pointer-events:auto;width:186px;font-size:12px;padding:6px 9px;border-radius:999px;outline:none;
  background:var(--dsw-alias-bg-elevated,rgba(32,35,42,.96));color:inherit;
  border:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.14))}
.dsh-pet-input:focus{border-color:var(--dsw-alias-accent,#5b8def)}
.dsh-pet-send{pointer-events:auto;border:none;border-radius:999px;width:26px;height:26px;cursor:pointer;font-size:13px;
  background:var(--dsw-alias-accent,#5b8def);color:#fff;display:flex;align-items:center;justify-content:center}
.dsh-pet-send[disabled]{opacity:.45;cursor:default}
.dsh-pet-actor{pointer-events:auto;cursor:pointer;width:104px;height:104px;position:relative;
  transform:scale(var(--pet-scale,1));transform-origin:bottom right}
.dsh-pet-actor svg{width:100%;height:100%;display:block;overflow:visible}
.dsh-pet-gear{position:absolute;right:-2px;top:-2px;pointer-events:auto;cursor:pointer;border:none;border-radius:999px;
  width:20px;height:20px;font-size:11px;line-height:1;opacity:0;transition:opacity .15s;
  background:var(--dsw-alias-bg-elevated,rgba(32,35,42,.96));color:inherit;border:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.12))}
.dsh-pet-actor-wrap:hover .dsh-pet-gear{opacity:1}
.dsh-pet-panel{pointer-events:auto;width:236px;padding:10px;border-radius:12px;font-size:12px;
  background:var(--dsw-alias-bg-elevated,rgba(32,35,42,.98));border:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.12));
  box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px}
.dsh-pet-panel h4{margin:0;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.dsh-pet-panel .x{cursor:pointer;opacity:.6;border:none;background:none;color:inherit;font-size:14px;line-height:1}
.dsh-pet-field{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dsh-pet-field span{opacity:.75}
.dsh-pet-panel select,.dsh-pet-panel input[type=time]{font-size:11.5px;padding:2px 4px;border-radius:6px;
  background:transparent;color:inherit;border:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.14))}
.dsh-pet-panel input[type=range]{width:96px;accent-color:var(--dsw-alias-accent,#5b8def)}
.dsh-pet-seg{display:flex;gap:4px}
.dsh-pet-seg button{flex:1;font-size:11.5px;padding:3px 0;border-radius:6px;cursor:pointer;color:inherit;
  background:transparent;border:1px solid var(--dsw-alias-border-subtle,rgba(255,255,255,.14))}
.dsh-pet-seg button.on{background:var(--dsw-alias-accent,#5b8def);border-color:transparent;color:#fff}
.dsh-pet-hint{opacity:.5;font-size:10.5px;line-height:1.4}

/* —— 动作 —— */
@keyframes dsh-pet-pop{from{transform:translateY(4px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes dsh-pet-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes dsh-pet-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}60%{transform:translateY(0)}}
@keyframes dsh-pet-dance{0%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(0) translateY(-5px)}
  50%{transform:rotate(9deg) translateY(0)}75%{transform:rotate(0) translateY(-5px)}100%{transform:rotate(-9deg) translateY(0)}}
@keyframes dsh-pet-shy{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
@keyframes dsh-pet-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}
  60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes dsh-pet-stroll{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
@keyframes dsh-pet-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes dsh-pet-talk{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.25)}}
@keyframes dsh-pet-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

body .dsh-pet-body{transform-origin:70px 112px;animation:dsh-pet-breathe 3.4s ease-in-out infinite}
.mood-walk body .dsh-pet-body{animation:dsh-pet-stroll 3.6s ease-in-out infinite,dsh-pet-breathe 1.1s ease-in-out infinite}
.mood-dance body .dsh-pet-body{animation:dsh-pet-dance .9s ease-in-out infinite}
.mood-shy body .dsh-pet-body{animation:dsh-pet-shy 1.5s ease-in-out infinite}
.mood-angry body .dsh-pet-body{animation:dsh-pet-shake .42s linear infinite}
.mood-happy body .dsh-pet-body{animation:dsh-pet-hop .85s ease-in-out infinite}
.mood-talk body .dsh-pet-body{animation:dsh-pet-breathe 2s ease-in-out infinite}
.dsh-pet-eye{transform-origin:center;animation:dsh-pet-blink 5.2s infinite}
.mood-sleep .dsh-pet-eye{animation:none}
.dsh-pet-mouth{transform-origin:center}
.mood-talk .dsh-pet-mouth{animation:dsh-pet-talk .22s ease-in-out infinite}
.dsh-pet-tail{transform-origin:96px 96px;animation:dsh-pet-sway 2.6s ease-in-out infinite}
.mood-angry .dsh-pet-tail{animation:dsh-pet-sway .5s ease-in-out infinite}
.dsh-pet-zzz{font-size:11px;opacity:.7}
@media (prefers-reduced-motion:reduce){
  .dsh-pet-body,.dsh-pet-eye,.dsh-pet-mouth,.dsh-pet-tail{animation:none!important}
}

</style>
